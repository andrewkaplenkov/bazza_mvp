version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: bazza_db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: bazza_backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: unless-stopped

  bot:
    build: ./bot
    container_name: bazza_bot
    env_file:
      - .env
    depends_on:
      - backend
    restart: unless-stopped

  admin:
    build: ./admin
    container_name: bazza_admin
    ports:
      - "3001:80"
    restart: unless-stopped

  miniapp:
    build: ./miniapp
    container_name: bazza_miniapp
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  pgdata: