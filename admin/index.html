<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bazza Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .tab-btn.active { background-color: #2563eb; color: white; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans">

    <div class="max-w-6xl mx-auto p-6">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">Bazza Admin MVP</h1>

        <div class="flex space-x-2 mb-6 border-b border-gray-200">
            <button onclick="switchTab('projects')" class="tab-btn active px-4 py-2 rounded-t-lg font-medium transition">Проекты (ЖК)</button>
            <button onclick="switchTab('knowledge')" class="tab-btn px-4 py-2 rounded-t-lg font-medium text-gray-600 hover:bg-gray-200 transition">База знаний</button>
            <button onclick="switchTab('rewards')" class="tab-btn px-4 py-2 rounded-t-lg font-medium text-gray-600 hover:bg-gray-200 transition">Вознаграждения</button>
        </div>

        <div id="projects" class="tab-content active">
            <h2 class="text-xl font-semibold mb-4">Управление жилыми комплексами</h2>
            <form id="add-project-form" class="bg-white p-4 rounded shadow mb-6 grid grid-cols-1 md:grid-cols-3 gap-4">
                <input type="text" name="name" placeholder="Название (напр. ЖК Алиса)" required class="border p-2 rounded">
                <input type="text" name="city" placeholder="Город" required class="border p-2 rounded">
                <input type="text" name="address" placeholder="Адрес" class="border p-2 rounded">
                <input type="text" name="completion_date" placeholder="Срок сдачи" class="border p-2 rounded">
                <input type="number" step="0.1" name="price_from" placeholder="Цена от" class="border p-2 rounded">
                <input type="text" name="image_url" placeholder="URL картинки" class="border p-2 rounded">
                <input type="number" step="0.1" name="reward_percent" placeholder="Вознаграждение %" value="2.1" class="border p-2 rounded">
                <textarea name="description" placeholder="Описание" class="border p-2 rounded md:col-span-2"></textarea>
                <button type="submit" class="bg-blue-600 text-white p-2 rounded hover:bg-blue-700 md:col-span-3">Добавить проект</button>
            </form>
            <div id="projects-list" class="space-y-4">
                <p class="text-gray-500">Загрузка...</p>
            </div>
        </div>

        <div id="knowledge" class="tab-content">
            <h2 class="text-xl font-semibold mb-4">База знаний (для бота)</h2>
            <form id="add-kb-form" class="bg-white p-4 rounded shadow mb-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" name="question" placeholder="Вопрос клиента" required class="border p-2 rounded md:col-span-2">
                <textarea name="answer" placeholder="Ответ бота" required class="border p-2 rounded md:col-span-2" rows="3"></textarea>
                <input type="text" name="category" placeholder="Категория (напр. Ипотека)" class="border p-2 rounded">
                <input type="number" name="project_id" placeholder="ID проекта (если привязан)" class="border p-2 rounded">
                <button type="submit" class="bg-green-600 text-white p-2 rounded hover:bg-green-700 md:col-span-2">Добавить в БЗ</button>
            </form>
            <div id="kb-list" class="space-y-4">
                <p class="text-gray-500">Загрузка...</p>
            </div>
        </div>

        <div id="rewards" class="tab-content">
            <h2 class="text-xl font-semibold mb-4">Партнерские вознаграждения</h2>
            <form id="add-reward-form" class="bg-white p-4 rounded shadow mb-6 grid grid-cols-1 md:grid-cols-3 gap-4">
                <input type="number" name="project_id" placeholder="ID проекта" required class="border p-2 rounded">
                <input type="number" step="0.1" name="reward_percent" placeholder="Процент %" required class="border p-2 rounded">
                <input type="text" name="description" placeholder="Описание/Условия" class="border p-2 rounded md:col-span-2">
                <button type="submit" class="bg-purple-600 text-white p-2 rounded hover:bg-purple-700 md:col-span-3">Добавить вознаграждение</button>
            </form>
            <div id="rewards-list" class="space-y-4">
                <p class="text-gray-500">Загрузка...</p>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }
    </script>

    <script src="script.js"></script>
</body>
</html>
